name: Collect daily embodied-AI papers

on:
  # Automatically validate collector changes; generated data commits do not match these paths.
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-arxiv-source-bundle.yml"
      - "scripts/collect_arxiv_bundle.py"
      - "requirements-arxiv-digest.txt"
  schedule:
    # Run before the 09:00 ChatGPT brief; timezone is explicit.
    - cron: "35 8 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-arxiv-source-bundle
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-arxiv-digest.txt

      - name: Install dependencies
        run: pip install -r requirements-arxiv-digest.txt

      - name: Collect arXiv, Hugging Face and GitHub evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/collect_arxiv_bundle.py

      - name: Commit source bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper-digests
          if git diff --cached --quiet; then
            echo "No source-bundle changes."
          else
            git commit -m "chore: update daily paper source bundle"

            # A manual run or another workflow may have pushed after checkout.
            # Rebase the generated digest onto the newest main and prefer this
            # run's generated JSON if the same daily files changed concurrently.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying against latest main."
              sleep 2
            done

            echo "Unable to push source bundle after 3 attempts."
            exit 1
          fi
